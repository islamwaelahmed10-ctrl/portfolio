- name: albums
  label: الألبومات
  label_singular: ألبوم
  icon: album
  description: كل ألبوم هنا بيبقى قسم في الصفحة الرئيسية. لإضافة ألبوم جديد دوس New. الترتيب حسب خانة «الترتيب».
  folder: content/albums
  extension: json
  format: json
  create: true
  delete: true
  slug: '{{fields.id}}'
  identifier_field: en
  summary: '{{fields.order}}. {{fields.en}} — {{fields.ar}} ({{fields.year}})'
  sortable_fields:
  - order
  - year
  - en
  editor:
    preview: false
  fields:
  - name: id
    label: كود الألبوم (إنجليزي صغير من غير مسافات، مثلاً ya3alam)
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - حروف إنجليزي صغيرة وأرقام وشرطة بس
  - name: order
    label: الترتيب في الصفحة (1 = الأول)
    widget: number
    value_type: int
    default: 3
  - name: theme
    label: ألوان القسم
    widget: object
    collapsed: false
    fields:
    - name: bg
      label: لون الخلفية
      widget: color
      default: '#1E2822'
    - name: fg
      label: لون الكلام
      widget: color
      default: '#F8F2EF'
    - name: accent
      label: اللون المميز (العناوين والأزرار)
      widget: color
      default: '#D9A9AC'
  - widget: object
    collapsed: false

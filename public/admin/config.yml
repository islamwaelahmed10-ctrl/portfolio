  - name: coverAlt
    label: وصف الغلاف (لجوجل وللمكفوفين)
    widget: string
  - widget: object
    collapsed: false
    fields:
    - name: ar
      label: عربي
      widget: text
    - name: en
      label: English
      widget: text
    name: about
    label: عن الألبوم
  - widget: list
    summary: '{{fields.label}}'
    fields:
    - name: label
      label: اسم الزرار (Spotify, YouTube...)
      widget: string
    - name: url
      label: اللينك
